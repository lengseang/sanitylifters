<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sanity Lifters — Idea Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-bar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="mobile-brand">SANITY <span>LIFTERS</span></div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="bar"></span>
          <span class="plate plate--l"></span>
          <span class="plate plate--r"></span>
        </div>
        <div class="brand-text">
          <span class="brand-name">SANITY</span>
          <span class="brand-sub">LIFTERS</span>
        </div>
      </header>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Search ideas…" autocomplete="off" spellcheck="false">
      </div>

      <nav class="tags" id="tags" aria-label="Filter by tag"></nav>

      <ul class="idea-list" id="ideaList"></ul>

      <footer class="sidebar-foot">
        <button class="btn-new" id="btnNew" type="button">＋ New idea</button>
      </footer>
    </aside>

    <main class="content">
      <section class="hero" id="hero">
        <div class="hero-particles" id="heroParticles" aria-hidden="true"></div>
        <div class="hero-barbell" aria-hidden="true">
          <div class="bb-plate bb-plate--l1"></div>
          <div class="bb-plate bb-plate--l2"></div>
          <div class="bb-plate bb-plate--l3"></div>
          <div class="bb-shaft"></div>
          <div class="bb-plate bb-plate--r3"></div>
          <div class="bb-plate bb-plate--r2"></div>
          <div class="bb-plate bb-plate--r1"></div>
        </div>
        <h1 class="hero-title">Sanity <span class="hero-title-accent">Lifters</span></h1>
        <p class="hero-tagline">Lift the heavy ideas first. Everything else is accessory work.</p>
        <div class="hero-meta" id="heroMeta"></div>
      </section>

      <article class="idea-view" id="ideaView" aria-live="polite"></article>
    </main>
  </div>

  <!-- Editor modal -->
  <div class="modal" id="editorModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card modal-card--wide" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="modal-head">
        <h2 id="editorTitle">New idea</h2>
        <button class="modal-close" data-close type="button" aria-label="Close">×</button>
      </header>
      <div class="editor">
        <input id="edTitle" class="editor-title" type="text" placeholder="Title" autocomplete="off">
        <input id="edSummary" class="editor-summary" type="text" placeholder="One-line summary" autocomplete="off">
        <div class="editor-row">
          <input id="edTags" type="text" placeholder="tags, comma-separated" autocomplete="off">
          <select id="edStatus">
            <option value="idea">idea</option>
            <option value="wip">wip</option>
            <option value="live">live</option>
          </select>
        </div>
        <div class="editor-row">
          <select id="edCategory">
            <option value="">— pillar —</option>
            <option value="overview">vision</option>
            <option value="coach">coach</option>
            <option value="train">train</option>
            <option value="engage">engage</option>
            <option value="connect">connect</option>
            <option value="content">content</option>
            <option value="monetize">monetize</option>
          </select>
          <select id="edPriority">
            <option value="">— priority —</option>
            <option value="p0">p0</option>
            <option value="p1">p1</option>
            <option value="p2">p2</option>
          </select>
        </div>
        <div class="editor-tabs">
          <button class="tab is-active" id="edWriteTab" type="button">Write</button>
          <button class="tab" id="edPreviewTab" type="button">Preview</button>
        </div>
        <textarea id="edBody" spellcheck="false" placeholder="Write in markdown…"></textarea>
        <div class="editor-preview" id="edPreview" hidden></div>
      </div>
      <footer class="modal-actions">
        <button class="btn-danger" id="edDelete" type="button" hidden>Delete</button>
        <span class="spacer"></span>
        <button class="btn-ghost" data-close type="button">Cancel</button>
        <button class="btn-primary" id="edSave" type="button">Save</button>
      </footer>
    </div>
  </div>

  <!-- Passcode modal -->
  <div class="modal" id="passcodeModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card modal-card--sm" role="dialog" aria-modal="true" aria-labelledby="passTitle">
      <header class="modal-head">
        <h2 id="passTitle">Unlock editing</h2>
        <button class="modal-close" data-close type="button" aria-label="Close">×</button>
      </header>
      <p class="modal-hint">Enter the passcode from the Vercel <code>ADMIN_PASSCODE</code> env var.</p>
      <form id="passForm" autocomplete="off">
        <input id="passInput" type="password" placeholder="Passcode" autocomplete="current-password">
        <footer class="modal-actions">
          <button type="button" class="btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn-primary">Unlock</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
